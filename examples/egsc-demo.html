<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>EGSC 4D Scene Demo</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="../egsc-pwa/manifest.json" />
    <meta name="theme-color" content="#101010" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      body { margin: 0; background: #101010; color: #eee; font: 14px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      header { padding: 8px 16px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; flex: none; }
      h1 { font-size: 16px; margin: 0; }
      #status { color: #8fd; }
      canvas { display: block; width: 100vw; flex: 1 1 auto; min-height: 120px; touch-action: none; }
      /* Centered loading overlay: download (0-50%) + decode (50-100%) */
      #bigload { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: none; background: radial-gradient(ellipse at center, rgba(16,16,16,0.55) 0%, rgba(16,16,16,0.0) 70%); z-index: 5; }
      #bigload[hidden] { display: none; }
      #bigload-label { color: #8fd; font: 600 14px/1 ui-monospace, monospace; letter-spacing: 0.08em; text-shadow: 0 1px 4px #000; }
      #bigload-bar { width: min(46vw, 420px); height: 10px; border-radius: 6px; background: #222; border: 1px solid #3a4a44; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.6); }
      #bigload-fill { height: 100%; width: 0%; border-radius: 5px; background: linear-gradient(90deg, #2f8f6f, #4fd); transition: width 0.15s ease-out; }
      #bigload-pct { color: #9cc; font: 12px/1 ui-monospace, monospace; text-shadow: 0 1px 3px #000; }
      #controls { display: flex; gap: 8px; align-items: center; padding: 8px 16px; flex-wrap: wrap; flex: none; }
      button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 14px; cursor: pointer; touch-action: manipulation; }
      button.hold { user-select: none; -webkit-user-select: none; padding: 6px 12px; }
      input[type="range"] { flex: 1; min-width: 200px; }
      #timing { font-family: ui-monospace, monospace; font-size: 12px; }
      #rollinfo { font-family: ui-monospace, monospace; font-size: 12px; color: #8fd; cursor: pointer; user-select: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>EGSC 4D Scene</h1>
      <span id="status">loading…</span>
      <span id="timing"></span>
      <span id="fps" title="Rendered frames per second" style="font-family:ui-monospace,monospace;font-size:12px;color:#8fd">— FPS</span>
    </header>
    <canvas id="scene" aria-label="4D scene"></canvas>
    <div id="bigload" aria-hidden="true">
      <div id="bigload-label">downloading…</div>
      <div id="bigload-bar"><div id="bigload-fill"></div></div>
      <div id="bigload-pct">0%</div>
    </div>
    <div id="controls">
      <button id="play">Play / pause</button>
      <button id="viewexport" title="Copy the current camera view (JSON + shareable URL)" style="border-color:#2f6f5f;color:#8fd">⤓ view</button>
      <button id="rollL" class="hold" title="Roll counter-clockwise (hold to spin, tap for a step)">↺</button>
      <span id="rollinfo" title="Click to reset roll">roll 0°</span>
      <button id="rollR" class="hold" title="Roll clockwise (hold to spin, tap for a step)">↻</button>
      <select id="rate" aria-label="Playback speed" title="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option><option value="1" selected>1×</option>
        <option value="1.5">1.5×</option><option value="2">2×</option>
        <option value="4">4×</option>
      </select>
      <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time" />
    </div>
    <script type="module">
      import { FTGSPlayer } from "../src/index.js";
      const status = document.getElementById("status");
      const timing = document.getElementById("timing");
      const query = new URLSearchParams(location.search);
      // default scene: page-relative first (GitHub Pages /examples/…), then
      // root-relative (EdgeOne serves this html at /) — probe with HEAD
      const resolveSrc = async () => {
        for (const c of ["./assets/scene-v9.egsc", "examples/assets/scene-v9.egsc"]) {
          try {
            if ((await fetch(new URL(c, location.href), { method: "HEAD" })).ok)
              return new URL(c, location.href).href;
          } catch { /* probe */ }
        }
        return new URL("./assets/scene-v9.egsc", location.href).href;
      };
      const src = query.get("src") ?? (await resolveSrc());
      const sceneUrl = src;
      const t0 = performance.now();
      let decodeMs = null;

      // PWA: register the service worker early (offline cache). Must be
      // http(s) (or localhost); file:// silently skips. Runs in parallel with
      // the scene load; activate() claims this page and install() pre-caches
      // the shell, so no first-visit reload is needed.
      (async () => {
        if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
        try {
          await navigator.serviceWorker.register(
            new URL("../sw.js", location.href).href,
            { scope: new URL("../", location.href).href },
          );
          let offlineShown = false;
          const offlineReady = () => {
            if (offlineShown) return;
            offlineShown = true;
            timing.textContent = `${timing.textContent.replace(/ \| offline ready$/, "")} | offline ready`;
          };
          await navigator.serviceWorker.ready;
          // NOTE: no first-visit reload here. activate() calls clients.claim(),
          // which takes control of this page immediately, and install()
          // pre-caches the shell — a reload would abort in-flight dynamic
          // module imports (egsc-loader.js) on first visit: exactly the
          // "Failed to fetch dynamically imported module" seen on fresh
          // origins (EdgeOne) while cached origins (GitHub) worked.
          const warm = async () => {
            try {
              const names = (await caches.keys()).filter((n) => n.startsWith("egsc-4d-"));
              for (const name of names) {
                const cache = await caches.open(name);
                if (await cache.match(sceneUrl)) {
                  offlineReady();
                  return;
                }
              }
              await fetch(sceneUrl);
              offlineReady();
            } catch { /* best effort */ }
          };
          await warm();
        } catch (e) {
          console.warn("service worker unavailable:", e);
        }
      })();

      const player = new FTGSPlayer(document.getElementById("scene"), {
        maxPoints: query.get("points") === "all" ? Infinity : 1000000,
        frames: query.get("frames") ? Number(query.get("frames")) : undefined,
        fps: query.get("fps") ? Number(query.get("fps")) : undefined,
      });
      window.__player = player; // console/debug handle
      // roll readout: live from the camera basis (never stale). The old
      // timeupdate-only refresh froze the readout when playback was paused
      // and it "jumped" on the next event.
      {
        const rollEl = document.getElementById("rollinfo");
        let lastRollText = "";
        const showRollLive = () => {
          const cam = player.camera;
          if (!cam) return;
          const deg = Math.round(cam.rollDegrees * 10) / 10;
          const txt = `roll ${deg}°`;
          if (txt !== lastRollText) { rollEl.textContent = txt; lastRollText = txt; }
        };
        player.addEventListener("loaded", showRollLive);
        const rollWatch = () => { showRollLive(); requestAnimationFrame(rollWatch); };
        requestAnimationFrame(rollWatch);
      }
      player.addEventListener("progress", (e) => {
        const p = e.detail?.progress ?? 0;
        status.textContent = p < 0.5 ? `downloading… ${(p / 0.5 * 100).toFixed(0)}%` : `decoding… ${((p - 0.5) / 0.5 * 100).toFixed(0)}%`;
        const fill = document.getElementById("bigload-fill");
        if (fill) {
          fill.style.width = `${(p * 100).toFixed(1)}%`;
          document.getElementById("bigload-label").textContent = p < 0.5 ? "downloading…" : "decoding…";
          document.getElementById("bigload-pct").textContent = `${(p * 100).toFixed(0)}%`;
        }
      });
      player.addEventListener("loaded", (e) => {
        decodeMs = performance.now() - t0;
        status.textContent = `ready — ${(e.detail?.pointCount ?? 0).toLocaleString()} Gaussians`;
        timing.textContent = `load+decode: ${(decodeMs / 1000).toFixed(2)} s`;
        document.getElementById("bigload")?.setAttribute("hidden", "");
        player.play();
      });
      player.addEventListener("error", (e) => {
        status.textContent = `error: ${e.detail?.error ?? "see console"}`;
        const bl = document.getElementById("bigload");
        if (bl) { bl.setAttribute("hidden", ""); }
      });
      // Default opening view (user-tuned); ?view= still overrides it.
      let initialView = {
        eye: [1.0356, -0.0149, 0.3992],
        target: [6.0327, -0.5524, 1.9712],
        up: [0.3135, 0.2004, -0.9282],
        fov: 45,
      };
      // Viewing-range limits (user-tuned boundary views): orbit direction
      // bounded by left/right/top/bottom, distance by near/far. The
      // reference (center) view anchors both the angle frame and the shell.
      const viewLimits = {
        reference: initialView,
        left:   { eye: [1.1428, -0.3466, 0.2924], target: [6.1196, -0.5578, 2.0004], up: [0.3256, 0.2017, -0.9238], fov: 45 },
        right:  { eye: [1.1591,  0.3253, 0.4692], target: [6.1196, -0.5578, 2.0004], up: [0.3212, 0.199,  -0.9259], fov: 45 },
        top:    { eye: [1.2404,  0.0078, 0.1018], target: [6.1196, -0.5578, 2.0004], up: [0.3751, 0.1919, -0.9069], fov: 45 },
        bottom: { eye: [1.0234, -0.1492, 0.7386], target: [6.1196, -0.5578, 2.0004], up: [0.2507, 0.2059, -0.9459], fov: 45 },
        near:   { eye: [1.5063, -0.0124, 0.5139], target: [6.4909, -0.4888, 2.1443], up: [0.3218, 0.1997, -0.9255], fov: 45 },
        far:    { eye: [1.0431,  0.0087, 0.3574], target: [6.0279, -0.4522, 1.9913], up: [0.3218, 0.1996, -0.9255], fov: 45 },
      };
      {
        const v = query.get("view");
        if (v) { try { initialView = JSON.parse(v); } catch { /* bad param: ignore */ } }
      }
      await player.load(new URL(src, location.href).href, { autoplay: true, view: initialView });
      player.camera?.setViewLimits?.(viewLimits);

      // FPS meter: counts actual splat renders (SplatRenderer.draw calls),
      // not display refresh — a static scene shows the true render idle state.
      {
        const fpsEl = document.getElementById("fps");
        let draws = 0, last = performance.now();
        const { SplatRenderer } = await import("../src/renderer.js");
        const origDraw = SplatRenderer.prototype.draw;
        SplatRenderer.prototype.draw = function (...args) {
          draws++;
          return origDraw.apply(this, args);
        };
        const loop = (now) => {
          if (now - last >= 500) {
            const fps = (draws * 1000) / (now - last);
            fpsEl.textContent = `${fps.toFixed(0)} FPS`;
            draws = 0;
            last = now;
          }
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }

      const timeline = document.getElementById("timeline");
      const play = document.getElementById("play");
      play.onclick = () => (player.playing ? player.pause() : player.play());
      timeline.oninput = () => player.seek(Number(timeline.value) * player.duration);

      // playback speed: select + keyboard > / < (step through the options)
      const rate = document.getElementById("rate");
      const RATES = [0.25, 0.5, 0.75, 1, 1.5, 2, 4];
      rate.onchange = () => player.setPlaybackRate(Number(rate.value));
      const stepRate = (dir) => {
        const cur = Number(rate.value);
        const i = Math.max(0, Math.min(RATES.length - 1, RATES.indexOf(cur) + dir));
        rate.value = String(RATES[i]);
        player.setPlaybackRate(RATES[i]);
      };
      window.addEventListener("keydown", (e) => {
        if (e.target instanceof HTMLSelectElement) return;
        if (e.key === "+" || e.key === "=") { e.preventDefault(); stepRate(1); }
        else if (e.key === "-" || e.key === "_") { e.preventDefault(); stepRate(-1); }
      });
      player.addEventListener("timeupdate", () => {
        timeline.value = player.duration ? player.time / player.duration : 0;
      });

      // camera roll: hold-to-spin buttons (touch friendly), tap = 2° step,
      // rollinfo click = reset, keyboard , / . on a focused canvas.
      // (the readout itself is the live rAF loop above)
      const rollinfo = document.getElementById("rollinfo");
      const DEG = Math.PI / 180;
      const showRoll = () => {}; // readout handled live above
      const holdButton = (el, rate) => {
        let raf = 0, last = 0, downAt = 0, moved = false;
        const step = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          player.camera.rotateRoll(rate * dt);
          if ((performance.now() - downAt) / 1000 * Math.abs(rate) > 1.5 * DEG) moved = true;
          showRoll();
          raf = requestAnimationFrame(step);
        };
        const start = (e) => {
          e.preventDefault();
          downAt = performance.now();
          moved = false;
          last = performance.now();
          raf = requestAnimationFrame(step);
        };
        const stop = () => {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          if (!moved) {
            player.camera.rotateRoll(2 * DEG * Math.sign(rate));
            showRoll();
          }
        };
        el.addEventListener("pointerdown", start);
        for (const ev of ["pointerup", "pointercancel", "pointerleave"])
          el.addEventListener(ev, stop);
      };
      holdButton(document.getElementById("rollL"), -30 * DEG);
      holdButton(document.getElementById("rollR"), 30 * DEG);
      rollinfo.onclick = () => { player.camera.resetRoll(); showRoll(); };

      // view export/import: click ⤓ view to copy the current camera as JSON
      // (+ a shareable ?view= link); open such a link to restore the view.
      const viewExport = document.getElementById("viewexport");
      viewExport.onclick = async () => {
        if (!player.state.loaded) return;
        const cam = player.camera;
        const snap = cam.snapshot();
        const view = {
          eye: snap.eye.map((v) => +v.toFixed(4)),
          target: cam.target.map((v) => +v.toFixed(4)),
          up: [cam.basis[3], cam.basis[4], cam.basis[5]].map((v) => +v.toFixed(4)),
          fov: +(cam.fov * 180 / Math.PI).toFixed(2),
        };
        const json = JSON.stringify(view);
        const link = new URL(location.href);
        link.searchParams.set("view", json);
        try {
          await navigator.clipboard.writeText(json + "\n" + link.href);
          viewExport.textContent = "copied!";
          setTimeout(() => (viewExport.textContent = "⤓ view"), 1500);
        } catch {
          // clipboard may be blocked: fall back to a prompt so the user can copy
          window.prompt("Camera view (JSON + shareable URL):", json + "\n" + link.href);
        }
        console.log("[view]", json);
        console.log("[view-url]", link.href);
      };

    </script>
  </body>
</html>
